name: One-time PR19 branch cleanup
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prune-pr19-once.yml'
permissions:
  contents: write
  pull-requests: read
jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Delete reviewed and merged PR19 branch only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          branch="feat/native-readonly-harness-context"
          inspected="68e91ffe075acb7e2bceabecf64d1d430c56f8ee"
          pr="$(gh api "repos/$REPO/pulls/19")"
          [[ "$(jq -r '.merged' <<< "$pr")" == true ]]
          [[ "$(jq -r '.head.ref' <<< "$pr")" == "$branch" ]]
          [[ "$(jq -r '.head.sha' <<< "$pr")" == "$inspected" ]]
          gh api "repos/$REPO/pulls?state=open&per_page=100" > "$RUNNER_TEMP/active-prs.json"
          if jq -e --arg branch "$branch" 'any(.[]; .head.ref == $branch)' "$RUNNER_TEMP/active-prs.json" >/dev/null; then
            echo "Branch still in use" >&2; exit 1
          fi
          sha="$(gh api "repos/$REPO/git/ref/heads/$branch" --jq '.object.sha')"
          [[ "$sha" == "$inspected" ]] || { echo "Branch advanced; refusing deletion" >&2; exit 1; }
          gh api --method DELETE "repos/$REPO/git/refs/heads/$branch"
          echo "Removed reviewed PR19 branch; Code Puppy core unchanged."
