name: One-time PR13 branch cleanup
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prune-pr13-once.yml'
permissions:
  contents: write
  pull-requests: read
jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Delete reviewed and merged PR13 branch only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          branch="feat/safe-saved-run-history"
          inspected="e6b23c1e5f6649e7740751584ad0715c2876c9e5"
          pr="$(gh api "repos/$REPO/pulls/13")"
          [[ "$(jq -r '.merged' <<< "$pr")" == true ]]
          [[ "$(jq -r '.head.ref' <<< "$pr")" == "$branch" ]]
          [[ "$(jq -r '.head.sha' <<< "$pr")" == "$inspected" ]]
          gh api "repos/$REPO/pulls?state=open&per_page=100" > "$RUNNER_TEMP/active-prs.json"
          if jq -e --arg branch "$branch" 'any(.[]; .head.ref == $branch)' "$RUNNER_TEMP/active-prs.json" > /dev/null; then
            echo "Branch is still used by an open PR" >&2
            exit 1
          fi
          sha="$(gh api "repos/$REPO/git/ref/heads/$branch" --jq '.object.sha')"
          [[ "$sha" == "$inspected" ]] || { echo "Branch advanced; refusing deletion" >&2; exit 1; }
          gh api --method DELETE "repos/$REPO/git/refs/heads/$branch"
          echo "Merged PR13 branch deleted. Source and Code Puppy core remain unchanged."
