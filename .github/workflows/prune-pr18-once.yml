name: One-time PR18 branch cleanup
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prune-pr18-once.yml'
permissions:
  contents: write
  pull-requests: read
jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Delete only inspected merged PR18 branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          branch="feat/read-only-chatbridge-compatibility-inspector"
          inspected="e92c5a02c5bd12c30aa42a426aaa99bed6003738"
          pr="$(gh api "repos/$REPO/pulls/18")"
          [[ "$(jq -r '.merged' <<< "$pr")" == true ]]
          [[ "$(jq -r '.head.ref' <<< "$pr")" == "$branch" ]]
          [[ "$(jq -r '.head.sha' <<< "$pr")" == "$inspected" ]]
          gh api "repos/$REPO/pulls?state=open&per_page=100" > "$RUNNER_TEMP/active-prs.json"
          if jq -e --arg branch "$branch" 'any(.[]; .head.ref == $branch)' "$RUNNER_TEMP/active-prs.json" >/dev/null; then
            echo "Branch used by an open PR" >&2; exit 1
          fi
          sha="$(gh api "repos/$REPO/git/ref/heads/$branch" --jq '.object.sha')"
          [[ "$sha" == "$inspected" ]] || { echo "Ref advanced; refusing deletion" >&2; exit 1; }
          gh api --method DELETE "repos/$REPO/git/refs/heads/$branch"
          echo "Merged PR18 branch deleted."
