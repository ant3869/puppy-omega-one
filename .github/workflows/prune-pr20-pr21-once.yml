name: One-time merged PR20 and PR21 branch cleanup
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prune-pr20-pr21-once.yml'
permissions:
  contents: write
  pull-requests: read
jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Verify merged branch identity before deletion
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api "repos/$REPO/pulls?state=open&per_page=100" > "$RUNNER_TEMP/active-prs.json"
          for spec in \
            "20|fix/sandboxed-preload-and-canonical-paths|07059eca3ba3687422a8c5867feddd13e2f73b49" \
            "21|chore/verify-electron-build-entries|92d4696a3f808f5d4ed6f693893bb921a21f81c6"; do
            IFS='|' read -r number branch inspected <<< "$spec"
            pr="$(gh api "repos/$REPO/pulls/$number")"
            [[ "$(jq -r '.merged' <<< "$pr")" == true ]] || { echo "PR $number not merged" >&2; exit 1; }
            [[ "$(jq -r '.head.ref' <<< "$pr")" == "$branch" ]] || { echo "Wrong PR branch" >&2; exit 1; }
            [[ "$(jq -r '.head.sha' <<< "$pr")" == "$inspected" ]] || { echo "PR head changed" >&2; exit 1; }
            if jq -e --arg b "$branch" 'any(.[]; .head.ref == $b)' "$RUNNER_TEMP/active-prs.json" >/dev/null; then
              echo "Branch $branch is used by an open PR" >&2; exit 1
            fi
            sha="$(gh api "repos/$REPO/git/ref/heads/$branch" --jq '.object.sha')"
            [[ "$sha" == "$inspected" ]] || { echo "Branch $branch advanced" >&2; exit 1; }
            gh api --method DELETE "repos/$REPO/git/refs/heads/$branch"
            echo "Deleted reviewed, merged branch $branch"
          done
