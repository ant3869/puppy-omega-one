name: One-time PR17 branch cleanup
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prune-pr17-once.yml'
permissions:
  contents: write
  pull-requests: read
jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Delete only inspected merged PR17 branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          branch="feat/chat-first-agent-workspace"
          inspected="7509d8606c73e6c79e05ebf909f90bdf34851002"
          pr="$(gh api "repos/$REPO/pulls/17")"
          [[ "$(jq -r '.merged' <<< "$pr")" == true ]]
          [[ "$(jq -r '.head.ref' <<< "$pr")" == "$branch" ]]
          [[ "$(jq -r '.head.sha' <<< "$pr")" == "$inspected" ]]
          gh api "repos/$REPO/pulls?state=open&per_page=100" > "$RUNNER_TEMP/active-prs.json"
          if jq -e --arg branch "$branch" 'any(.[]; .head.ref == $branch)' "$RUNNER_TEMP/active-prs.json" >/dev/null; then
            echo "Branch still in use" >&2; exit 1
          fi
          sha="$(gh api "repos/$REPO/git/ref/heads/$branch" --jq '.object.sha')"
          [[ "$sha" == "$inspected" ]] || { echo "Ref advanced; refusing delete" >&2; exit 1; }
          gh api --method DELETE "repos/$REPO/git/refs/heads/$branch"
          echo "Deleted merged branch; app code unaffected."
