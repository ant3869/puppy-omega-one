name: Validate
on:
  push:
  pull_request:

jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docs, status and local links
        run: python3 tests/check_docs.py
      - name: Validate shell syntax
        run: bash -n install.sh tests/smoke_install.sh
      - name: Smoke-test installation and agent manifests
        run: bash tests/smoke_install.sh

  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check PowerShell installation
        shell: pwsh
        run: |
          $project = Join-Path $env:RUNNER_TEMP 'puppy-omega-smoke'
          New-Item -ItemType Directory -Force -Path $project | Out-Null
          Set-Content -Path (Join-Path $project 'AGENTS.md') -Value 'existing rules'
          Set-Content -Path (Join-Path $project 'puppy.cfg') -Value 'keep-project-cfg'
          ./install.ps1 -Target $project
          if ((Get-Content (Join-Path $project 'AGENTS.md') -Raw).Trim() -ne 'existing rules') { throw 'Overwrote existing rules' }
          if ((Get-Content (Join-Path $project 'puppy.cfg') -Raw).Trim() -ne 'keep-project-cfg') { throw 'Altered project config' }
          ./install.ps1 -Target $project -Force
          if ((Get-Content (Join-Path $project 'AGENTS.md') -Raw) -ne (Get-Content templates/AGENTS.md -Raw)) { throw 'Force did not replace rules' }
          if (!(Test-Path (Join-Path $project '.code_puppy/agents/omega-orchestrator-agent.json'))) { throw 'Missing installed agent' }
          # A project install must never target the global Code Puppy config.
          $core = Join-Path $env:USERPROFILE '.code_puppy'
          New-Item -ItemType Directory -Force -Path $core | Out-Null
          $sentinel = Join-Path $core 'omega-install-test-sentinel.txt'
          Set-Content -Path $sentinel -Value 'untouched'
          $rejected = $false
          try { ./install.ps1 -Target $env:USERPROFILE -Force } catch { $rejected = $true }
          if (!$rejected) { throw 'Installer allowed user profile target' }
          if ((Get-Content $sentinel -Raw).Trim() -ne 'untouched') { throw 'Installer changed core sentinel' }
          # Junction redirection must be rejected before writing ANY project files.
          $unsafe = Join-Path $env:RUNNER_TEMP 'puppy-omega-redirect-test'
          New-Item -ItemType Directory -Force -Path $unsafe | Out-Null
          New-Item -ItemType Junction -Path (Join-Path $unsafe '.code_puppy') -Target $core | Out-Null
          $rejected = $false
          try { ./install.ps1 -Target $unsafe -Force } catch { $rejected = $true }
          if (!$rejected) { throw 'Installer allowed junction redirected to global core' }
          if (Test-Path (Join-Path $unsafe 'AGENTS.md')) { throw 'Installer wrote files before rejecting junction' }
          if ((Get-Content $sentinel -Raw).Trim() -ne 'untouched') { throw 'Junction test changed core sentinel' }
          # A configured Python inside Scripts/ must protect the entire venv.
          $venv = Join-Path $env:RUNNER_TEMP 'omega-custom-python-venv'
          $sitePackage = Join-Path $venv 'Lib\site-packages\code_puppy'
          New-Item -ItemType Directory -Path $sitePackage -Force | Out-Null
          Set-Content -Path (Join-Path $sitePackage 'sentinel') -Value 'untouched'
          Set-Content -Path (Join-Path $venv 'pyvenv.cfg') -Value 'home = C:\Windows'
          $env:CODE_PUPPY_PYTHON = Join-Path $venv 'Scripts\python.exe'
          $rejected = $false
          try { ./install.ps1 -Target $sitePackage -Force } catch { $rejected = $true }
          Remove-Item Env:CODE_PUPPY_PYTHON -ErrorAction SilentlyContinue
          if (!$rejected) { throw 'Installer allowed package source in custom Python venv' }
          if (Test-Path (Join-Path $sitePackage 'AGENTS.md')) { throw 'Custom Python venv was modified' }
          if ((Get-Content (Join-Path $sitePackage 'sentinel') -Raw).Trim() -ne 'untouched') { throw 'Custom Python sentinel changed' }
          # Without pyvenv.cfg, a system Python in System32 must not block
          # an unrelated project on the same drive.
          $env:CODE_PUPPY_PYTHON = Join-Path $env:WINDIR 'System32\python.exe'
          $systemSafe = Join-Path $env:RUNNER_TEMP 'omega-safe-with-system-python'
          New-Item -ItemType Directory -Path $systemSafe -Force | Out-Null
          ./install.ps1 -Target $systemSafe
          if (!(Test-Path (Join-Path $systemSafe 'AGENTS.md'))) { throw 'System Python blocked a normal project' }
          Remove-Item Env:CODE_PUPPY_PYTHON -ErrorAction SilentlyContinue
          # Also block an automatically discovered GUI checkout inside home.
          $gui = Join-Path $env:USERPROFILE 'projects\puppy_gui'
          New-Item -ItemType Directory -Path $gui -Force | Out-Null
          $rejected = $false
          try { ./install.ps1 -Target $gui -Force } catch { $rejected = $true }
          if (!$rejected) { throw 'Installer allowed auto-discovered GUI checkout' }
          if (Test-Path (Join-Path $gui 'AGENTS.md')) { throw 'Auto-discovered GUI checkout was modified' }

  electron:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: electron
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Test workflow events
        run: npm test
      - name: Build
        run: npm run build
