# One-shot cleanup requested after review/merge of PRs #1–#11.
# Runs only when this file is added/changed on main. No repo code is touched.
name: One-time inspected branch cleanup
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-branch-prune.yml'
permissions:
  contents: write
  pull-requests: read
concurrency:
  group: puppy-omega-inspected-branch-prune
  cancel-in-progress: false
jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Verify PR status and exact refs before deleting anything
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/inspected-branches.txt"
          ready="$RUNNER_TEMP/approved-for-prune.txt"
          : > "$ready"
          cat > "$manifest" <<'BRANCHES'
audit/portable-install-and-reliability|1381080ceab8246f05ec55dc3c25980af5a44484|1|merged
audit/setup-handoff-reliability|a31e785eed10df6650ce17fcee4020ec667cc60e|2|superseded
audit/activate-reflect-skill|cb65d1c2bf4815734fed66dcb1649a9a3d2b88fa|3|merged
feat/animated-omega-command-center|d7714ff7a62cb1055b5513350d96b2f6b4577be6|5|merged
feat/live-workflow-events|1f8d78485474c5b9ff9a17d6d8e868368fdf65aa|6|merged
fix/core-isolation-guards|fc707233032d501701257c85418cd01517105bc6|7|merged
feat/project-bound-gui-launch|ed258a1ea0a2f58e69fb068031eb1400456677ed|8|merged
feat/dashboard-harness-chat-dock|a5530b6bea7b13cb39954d32130a96d4839807b7|9|merged
fix/review-findings-core-and-telemetry|PR_HEAD|10|merged
maintenance/one-time-branch-prune|PR_HEAD|11|merged
          BRANCHES
          gh api "repos/$REPO/pulls?state=open&per_page=100" > "$RUNNER_TEMP/open-prs.json"
          while IFS='|' read -r branch pinned_sha pr mode; do
            [[ -n "$branch" ]] || continue
            if [[ "$branch" == main ]]; then echo "Refusing main" >&2; exit 1; fi
            pr_json="$(gh api "repos/$REPO/pulls/$pr")"
            actual_branch="$(jq -r '.head.ref' <<< "$pr_json")"
            merged="$(jq -r '.merged' <<< "$pr_json")"
            state="$(jq -r '.state' <<< "$pr_json")"
            [[ "$actual_branch" == "$branch" ]] || { echo "PR $pr head changed" >&2; exit 1; }
            if [[ "$mode" == merged ]]; then
              [[ "$merged" == true ]] || { echo "PR $pr not merged" >&2; exit 1; }
            else
              [[ "$mode" == superseded && "$state" == closed && "$merged" == false ]] ||
                { echo "Unverified supersession for PR $pr" >&2; exit 1; }
              jq -e '.body | contains("Superseded by merged PR #1")' <<< "$pr_json" >/dev/null ||
                { echo "PR $pr is not documented as superseded" >&2; exit 1; }
            fi
            expected="$pinned_sha"
            if [[ "$expected" == PR_HEAD ]]; then expected="$(jq -r '.head.sha' <<< "$pr_json")"; fi
            if current="$(gh api "repos/$REPO/git/ref/heads/$branch" --jq '.object.sha' 2>/dev/null)"; then
              [[ "$current" == "$expected" ]] || { echo "Branch advanced: $branch" >&2; exit 1; }
              if jq -e --arg branch "$branch" 'any(.[]; .head.ref == $branch)' "$RUNNER_TEMP/open-prs.json" >/dev/null; then
                echo "Open PR still uses $branch" >&2; exit 1
              fi
              printf '%s|%s\n' "$branch" "$expected" >> "$ready"
            else
              echo "Already absent: $branch"
            fi
          done < "$manifest"

          echo "All candidate refs passed preflight. Beginning exact-SHA deletes."
          while IFS='|' read -r branch expected; do
            current="$(gh api "repos/$REPO/git/ref/heads/$branch" --jq '.object.sha')"
            [[ "$current" == "$expected" ]] || { echo "Ref changed before deletion: $branch" >&2; exit 1; }
            gh api "repos/$REPO/pulls?state=open&per_page=100" > "$RUNNER_TEMP/open-prs.json"
            if jq -e --arg branch "$branch" 'any(.[]; .head.ref == $branch)' "$RUNNER_TEMP/open-prs.json" >/dev/null; then
              echo "Open PR appeared for $branch" >&2; exit 1
            fi
            gh api --method DELETE "repos/$REPO/git/refs/heads/$branch"
            echo "Deleted inspected branch: $branch"
          done < "$ready"
          echo "Cleanup complete; main was not modified."
